<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="A window">
  <!--
    The room's window, abstracted to what survives 16px.

    **Cool glass in a warm frame, because you are standing inside.** The first attempt drew
    amber glass — a lit window seen from outside at night — which is the wrong vantage: the
    room looks OUT at the yard where the feeder is. --room-daylight is in tokens.css for
    exactly this and is the mark's whole contrast.

    **The bars are thin on purpose.** They were 2-unit gaps between four separate panes, which
    is not how a window reads: thick spacing between tiles is an app grid, and that is what it
    looked like. One continuous pane with 1-unit bars cut through it reads as glazing.

    **The sill is load-bearing.** It is the one cue a grid cannot have, and it is most of what
    makes this a window rather than a divided rectangle.

    Deliberately NOT prefers-color-scheme aware, unlike the Astro default this replaced. That
    trick only works for a monochrome glyph. This mark carries its own light/dark contrast
    within itself, and a mark that holds still is what lets someone find the tab.

    Colours are --room-ink, --room-daylight and --room-line from src/styles/tokens.css,
    inlined: a favicon is a separate document and inherits no custom properties from the page.

    tools/favicon.py re-derives the PNG/ICO fallbacks from this geometry — EDIT BOTH.
  -->
  <rect width="16" height="16" rx="3.5" fill="#2c241d" />
  <rect x="3" y="2.6" width="10" height="9.2" fill="#b9d6e6" />
  <g fill="#2c241d">
    <rect x="7.5" y="2.6" width="1" height="9.2" />
    <rect x="3" y="6.7" width="10" height="1" />
  </g>
  <rect x="2" y="12.3" width="12" height="1.3" rx="0.35" fill="#d2c0a6" />
</svg>
